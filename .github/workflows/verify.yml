name: Verify StoreFlow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      STOREFLOW_SECRET_KEY: test-only-storeflow-native-ci-key-not-for-production
      STOREFLOW_DEMO: "1"
      STOREFLOW_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python backend/manage.py test
      - run: python scripts/test_database_tools.py -v
      - run: python main.py --check
      - name: Backup / restore verification
        shell: bash
        run: |
          python scripts/backup.py --output backups/native.sqlite3
          python scripts/restore.py --input backups/native.sqlite3 --target runtime/restored.sqlite3
          python scripts/database_snapshot.py > before.json
          python scripts/database_snapshot.py --file runtime/restored.sqlite3 > after.json
          python -c "import json; assert json.load(open('before.json',encoding='utf-8')) == json.load(open('after.json',encoding='utf-8'))"
          python main.py --check
          python scripts/database_snapshot.py > restarted.json
          python -c "import json; assert json.load(open('before.json',encoding='utf-8')) == json.load(open('restarted.json',encoding='utf-8'))"
  postgres:
    name: PostgreSQL 16 / transaction tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: storeflow
          POSTGRES_USER: storeflow
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storeflow -d storeflow"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DATABASE_URL: postgresql://storeflow:ci-only-postgres-password@localhost:5432/storeflow
      STOREFLOW_SECRET_KEY: test-only-storeflow-postgres-ci-key-not-for-production
      STOREFLOW_DEMO: "1"
      STOREFLOW_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python backend/manage.py test
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py seed_demo
  container:
    name: Docker / restart / PostgreSQL restore
    needs: [native, postgres]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-container-password
      STOREFLOW_DEMO: "1"
      STOREFLOW_DEMO_PASSWORD: Demo2026!
    steps:
      - uses: actions/checkout@v4
      - name: Build and start actual containers
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: HTTP smoke and database backup
        run: |
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8765/api/health/
          curl --fail http://127.0.0.1:8765/ -o /tmp/storeflow-home.html
          python scripts/verify_http.py --url http://127.0.0.1:8765
          docker compose exec -T app python scripts/database_snapshot.py > before.json
          docker compose exec -T app python scripts/backup.py --output /app/runtime/ci.dump
          docker compose exec -T app python scripts/restore.py --input /app/runtime/ci.dump --database storeflow_restored
          docker compose exec -T app python scripts/database_snapshot.py --database storeflow_restored > restored.json
          python -c "import json; assert json.load(open('before.json')) == json.load(open('restored.json'))"
      - name: Recreate application and verify persisted data
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 180 app
          curl --fail http://127.0.0.1:8765/api/health/
          docker compose exec -T app python scripts/database_snapshot.py > after.json
          python -c "import json; assert json.load(open('before.json')) == json.load(open('after.json'))"
      - name: Save container diagnostics
        if: always()
        run: docker compose logs --no-color > container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification
          path: |
            container.log
            before.json
            restored.json
            after.json
      - name: Stop containers
        if: always()
        run: docker compose down
