services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storeflow}
      POSTGRES_USER: ${POSTGRES_USER:-storeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-storeflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-storeflow}
      STOREFLOW_DEMO: ${STOREFLOW_DEMO:-1}
      STOREFLOW_DEMO_PASSWORD: ${STOREFLOW_DEMO_PASSWORD:-Demo2026!}
      STOREFLOW_DEBUG: "0"
      STOREFLOW_ALLOWED_HOSTS: localhost,127.0.0.1,app
    volumes:
      - app-runtime:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  app-runtime:
